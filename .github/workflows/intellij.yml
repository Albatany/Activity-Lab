name: Build IntelliJ plugin

on:
  push:
    paths:
      - 'intellij/**'
      - 'scripts/**'
      - 'languages.json'
      - 'modes.js'
      - 'fileNaming.js'
      - '.github/workflows/intellij.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate shared catalog
        run: node scripts/sync-intellij-catalog.js --check
      - name: Build and test on Linux
        if: runner.os != 'Windows'
        working-directory: intellij
        run: bash ./gradlew test buildPlugin verifyPluginStructure --no-daemon
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        working-directory: intellij
        run: .\gradlew.bat test buildPlugin verifyPluginStructure --no-daemon
      - name: Upload installer and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-lab-intellij-${{ runner.os }}
          path: |
            intellij/build/distributions/*.zip
            intellij/build/reports/tests/
          if-no-files-found: warn

  compatibility:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JetBrains Plugin Verifier
        working-directory: intellij
        run: bash ./gradlew verifyPlugin -PverifyRecommended --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellij-compatibility-reports
          path: intellij/build/reports/pluginVerifier/
          if-no-files-found: warn
