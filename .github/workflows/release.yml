name: Publish Activity Lab

on:
  workflow_dispatch:
    inputs:
      failed_tag:
        description: Older failed tag to remove after both new downloads are verified
        required: false
        type: string
        default: ''

concurrency:
  group: activity-lab-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: ${{ github.repository_owner }}
      - name: Test and build
        run: |
          npm run check
          npm test
          npm run build
          python -B tests/release_test.py
      - name: Publish and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          FAILED_TAG: ${{ inputs.failed_tag }}
        run: python scripts/publish.py
